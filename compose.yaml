# Starts the whole product with one command: docker compose up --build
# Open http://localhost:5173 and sign in with a demo user from the README. Settings: .env.example (ADR 0003).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # The database file lives in the named volume below, so it survives "docker compose down".
      DATABASE_URL: file:/data/app.db
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret-change-me}
      PURCHASING_LEAD_TIME_WEEKS: ${PURCHASING_LEAD_TIME_WEEKS:-4}
      # nginx in the web container is the one proxy in front of the API, for the client IP in the audit log (ADR 0012).
      # This is safe because the API has no published port: every request comes through nginx.
      TRUST_PROXY_HOPS: 1
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
