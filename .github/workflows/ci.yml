# Runs the same checks as the README on every pull request, so a broken merge is seen before it reaches master.
# Needs no secrets: the tests create their own temporary SQLite databases.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19" # the oldest version the README allows
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
