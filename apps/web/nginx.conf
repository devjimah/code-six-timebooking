# Serves the built web app and forwards /api to the API container, like the Vite proxy does in development.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The app has its own routes (/time, /orders/1 …): reloading such a page must still load the app.
    location / {
        try_files $uri /index.html;
    }
}
